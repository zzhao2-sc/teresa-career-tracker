name: Daily official job scan

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify tracked jobs and discover official postings
        run: node scripts/scan-jobs.mjs
      - name: Save scan result
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "teresa-career-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Daily job scan"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish refreshed tracker
        id: deployment
        uses: actions/deploy-pages@v4
